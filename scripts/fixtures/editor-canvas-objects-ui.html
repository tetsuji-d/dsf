<script>
const $=id=>document.getElementById(id),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));let pages=[{id:'c1',label:'C1 · 表紙',cover:true},{id:'c2',label:'C2 · 表紙裏'},{id:'p1',label:'1 · 扉',flow:'Flow 1',title:true},{id:'p2',label:'2 · 本文',flow:'Flow 1'},{id:'p3',label:'3 · 画像・図形',graphic:true},{id:'p4',label:'4 · 本文',flow:'Flow 2'},{id:'c3',label:'C3 · 裏表紙裏'},{id:'c4',label:'C4 · 裏表紙',cover:true}];let model={kind:'image',x:25,y:100,w:190,h:170,r:0,fill:'#f5e2aa',stroke:'#315579',text:'#23445b',iw:230,ih:200,ix:-25,iy:-10};const original=structuredClone(model);let history=[],cropMode=false,cropBefore=null,crop={x:0,y:0,w:190,h:170},popup=null,joined=true,viewerIndex=0,viewerSpread=false;

const prose='風が通り過ぎるたび、木々の葉が静かな音を立てた。遠い記憶の中にある風景が、目の前に広がっている。\n\n私は足を止め、空を見上げた。この場所から、また新しい物語が始まるのだろう。';
function remember(){syncModel();history.push(JSON.stringify({pages,objects,selectedId}));$('undo').disabled=false}function notice(s){$('status').textContent=s}function closePopup(){popup?.remove();popup=null}
function buildPages(){const strip=$('strip');strip.replaceChildren();for(let i=0;i<pages.length;i++){const p=pages[i];if(i){const b=document.createElement('div');b.className='boundary'+(joined&&i%2===0?' join':'');b.dataset.before=p.id;b.title='ここを右クリックしてページを挿入';b.oncontextmenu=e=>{e.preventDefault();showInsert(e,b.dataset.before)};strip.append(b)}const slot=document.createElement('div');slot.className='slot';slot.dataset.id=p.id;slot.innerHTML=`<div class="spread-label">${p.cover?'単独ページ':joined?(i%2===1?'見開きの組':'↔ ページがつながります'):''}</div><div class="page${p.graphic?' selected':''}" tabindex="0" aria-label="${p.label}"></div><div class="caption" title="長押ししてページを移動">${p.label}</div><div class="flow-label" ${p.flow?'':'style="visibility:hidden"'}>${p.flow||'画像'}${p.flow?' · 原稿のまとまり':''}</div>`;const page=slot.querySelector('.page');if(p.cover)page.innerHTML='<div class="cover"><small>DSF STORIES</small><h1>旅の記憶</h1><p>風景と物語</p></div>';else if(p.title)page.innerHTML='<div class="body" style="display:flex;align-items:center;justify-content:center;font-size:20px">第一章　旅のはじまり</div>';else if(!p.graphic)page.innerHTML='<div class="body"></div>',page.firstChild.textContent=prose;slot.querySelector('.caption').onpointerdown=e=>beginPageDrag(e,p);page.oncontextmenu=e=>{if(e.target.closest('.object'))return;e.preventDefault();activePageId=p.id;showPasteMenu(e,p.id)};page.addEventListener('pointerdown',()=>{activePageId=p.id});page.onpointerdown=e=>{const r=page.getBoundingClientRect();if(e.target===page&&(e.offsetX<12||e.offsetX>r.width-12||e.offsetY<12||e.offsetY>r.height-12))beginPageDrag(e,p)};strip.append(slot)}drawObject()}
function renderSingle(){let parent=document.querySelector(`[data-id="${model.pageId||'p3'}"] .page`);if(!parent)return;const object=document.createElement('div');object.className='object'+(cropMode?' cropping':'');object.id='object';Object.assign(object.style,{left:model.x+'px',top:model.y+'px',width:model.w+'px',height:model.h+'px',transform:`rotate(${model.r}deg)`});object.innerHTML='<div class="content"></div><div class="selection"></div>'+['nw','ne','sw','se'].map(k=>`<span class="handle ${k}" data-resize="${k}" title="${k} · 拡縮"></span>`).join('')+'<span class="rotate" data-rotate title="回転">↻</span>';const content=object.querySelector('.content');content.style.background=model.fill;content.style.borderColor=model.stroke;content.style.color=model.text;if(model.kind==='image'){content.style.background='none';const img=document.createElement('img');img.src=model.src||landscape;img.style.transform=model.flip?'scaleX(-1)':'';img.className='image'+(cropMode?' ghost':'');Object.assign(img.style,{width:model.iw+'px',height:model.ih+'px',left:model.ix+'px',top:model.iy+'px'});content.append(img);if(cropMode){const win=document.createElement('div');win.className='crop-visible';Object.assign(win.style,{left:crop.x+'px',top:crop.y+'px',width:crop.w+'px',height:crop.h+'px'});const image=img.cloneNode();image.classList.remove('ghost');image.style.left=model.ix-crop.x+'px';image.style.top=model.iy-crop.y+'px';win.append(image);content.append(win);const frame=document.createElement('div');frame.className='crop-frame';Object.assign(frame.style,{left:crop.x+'px',top:crop.y+'px',width:crop.w+'px',height:crop.h+'px'});frame.innerHTML=['nw','n','ne','e','se','s','sw','w'].map(k=>`<span class="crop-handle ${k}" data-crop="${k}" title="トリミング枠 ${k}"></span>`).join('');object.append(frame)}}else{content.style.borderRadius=model.kind==='shape'?'25px':'0';const txt=document.createElement('div');txt.className='text';txt.textContent=model.kind==='shape'?'旅を、\n自由に。':'記憶に残る\n風景と物語';content.append(txt)}object.onpointerdown=objectDrag;parent.append(object);for(const b of document.querySelectorAll('[data-color]')){b.querySelector('i').style.background=model[b.dataset.color];b.title={fill:'塗りつぶし',stroke:'枠線',text:'文字色'}[b.dataset.color]+' · '+model[b.dataset.color]};$('crop').hidden=model.kind!=='image';$('crop').classList.toggle('active',cropMode);$('crop-done').hidden=$('crop-cancel').hidden=!cropMode;$('mode-hint').textContent=cropMode?'黒いハンドルで範囲を変更 · 画像をドラッグして構図を調整 · Enterで確定／Escで取消':'白い四隅で拡縮 · 上の丸で回転（Shiftで15°刻み）'}
function objectDrag(e){if(e.button!==0)return;e.stopPropagation();e.preventDefault();const target=e.target,handle=target.dataset.resize,cropHandle=target.dataset.crop,rotate=target.hasAttribute('data-rotate'),start=structuredClone(model),c=structuredClone(crop),px=e.clientX,py=e.clientY,rect=$('object').getBoundingClientRect(),cx=rect.x+rect.width/2,cy=rect.y+rect.height/2,startAngle=Math.atan2(py-cy,px-cx);remember();const move=ev=>{const dx=ev.clientX-px,dy=ev.clientY-py,rad=start.r*Math.PI/180,ux=dx*Math.cos(rad)+dy*Math.sin(rad),uy=-dx*Math.sin(rad)+dy*Math.cos(rad);if(cropMode){if(cropHandle){let x=c.x,y=c.y,w=c.w,h=c.h;if(cropHandle.includes('w')){x=clamp(c.x+ux,0,c.x+c.w-25);w=c.w+c.x-x}if(cropHandle.includes('e'))w=clamp(c.w+ux,25,start.w-c.x);if(cropHandle.includes('n')){y=clamp(c.y+uy,0,c.y+c.h-25);h=c.h+c.y-y}if(cropHandle.includes('s'))h=clamp(c.h+uy,25,start.h-c.y);crop={x,y,w,h}}else{model.ix=clamp(start.ix+ux,c.x+c.w-start.iw,c.x);model.iy=clamp(start.iy+uy,c.y+c.h-start.ih,c.y)}}else if(rotate){let angle=start.r+(Math.atan2(ev.clientY-cy,ev.clientX-cx)-startAngle)*180/Math.PI;model.r=ev.shiftKey?Math.round(angle/15)*15:Math.round(angle);notice('回転 '+model.r+'°')}else if(handle){const sx=handle.includes('w')?-1:1,sy=handle.includes('n')?-1:1;let w=clamp(start.w+ux*sx,35,400),h=clamp(start.h+uy*sy,30,500);if(start.kind==='image'&&!ev.shiftKey)h=w*start.h/start.w;const shiftX=(w-start.w)*sx/2,shiftY=(h-start.h)*sy/2;model.w=w;model.h=h;model.x=start.x+start.w/2+shiftX*Math.cos(rad)-shiftY*Math.sin(rad)-w/2;model.y=start.y+start.h/2+shiftX*Math.sin(rad)+shiftY*Math.cos(rad)-h/2;model.iw=start.iw*w/start.w;model.ih=start.ih*h/start.h;model.ix=start.ix*w/start.w;model.iy=start.iy*h/start.h}else{model.x=start.x+dx;model.y=start.y+dy}drawObject()};const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up)};document.addEventListener('pointermove',move);document.a function placePopup(x,y){document.body.append(popup);const r=popup.getBoundingClientRect();popup.style.left=clamp(x,8,innerWidth-r.width-8)+'px';popup.style.top=clamp(y,8,innerHeight-r.height-8)+'px'}
function showInsert(e,before){closePopup();popup=document.createElement('div');popup.className='popup';for(const [name,kind] of [['画像ページ','image'],['見開き画像ページ','spread'],['Flow原稿','flow']]){const b=document.createElement('button');b.textContent=name+'を挿入';b.onclick=()=>{remember();const id='new'+Date.now(),index=pages.findIndex(p=>p.id===before),list=kind==='spread'?[{id:id+'a',label:'追加画像 · 見開き右'},{id:id+'b',label:'追加画像 · 見開き左'}]:[{id,label:'追加 · '+name,...(kind==='flow'?{flow:'新しいFlow'}:{})}];pages.splice(index,0,...list);closePopup();buildPages();notice(name+'を挿入しました（試作）。実装では通し番号と見開きの組を再計算します。')};popup.append(b)}placePopup(e.clientX,e.clientY)}
function beginPageDrag(e,p){if(e.button!==0)return;if(p.id.startsWith('c')){notice('表紙C1〜C4は表紙構成として固定します');return}const x=e.clientX,y=e.clientY;let started=false,ghost=null,before=null;const ids=pages.filter(v=>p.flow?v.flow===p.flow:v.id===p.id).map(v=>v.id);const timer=setTimeout(()=>{started=true;ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=p.flow?p.flow+' 全体 · '+ids.length+'ページ':p.label;document.body.append(ghost);ghost.style.left=x+15+'px';ghost.style.top=y+15+'px';notice('移動先の境界で離してください。Escで取消。');getSelection()?.removeAllRanges()},450);const move=ev=>{if(!started){if(Math.hypot(ev.clientX-x,ev.clientY-y)>7)end();return}ev.preventDefault();ghost.style.left=ev.clientX+15+'px';ghost.style.top=ev.clientY+15+'px';const bounds=$('viewport').getBoundingClientRect();if(ev.clientX<bounds.left+55)$('viewport').scrollLeft-=18;if(ev.clientX>bounds.right-55)$('viewport').scrollLeft+=18;const hit=document.elementFromPoint(ev.clientX,ev.clientY),boundary=hit?.closest('.boundary');before=boundary?.dataset.before||null;document.querySelectorAll('.boundary.drop').forEach(n=>n.classList.remove('drop'));if(boundary&&!ids.includes(before)&&before!=='c2'&&before!=='c4')boundary.classList.add('drop');else before=null};const key=ev=>{if(ev.key==='Escape')end()};function end(ev){clearTimeout(timer);document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);document.removeEventListener('pointercancel',end);document.removeEventListener('keydown',key);ghost?.remove();document.querySelectorAll('.boundary.drop').forEach(n=>n.classList.remove('drop'));if(started&&ev?.type==='pointerup'&&before){remember();const moved=pages.filter(v=>ids.includes(v.id));pages=pages.filter(v=>!ids.includes(v.id));pages.splice(pages.findIndex(v=>v.id===before),0,...moved);buildPages();notice((p.flow||p.label)+'を移動しました')}else if(started)notice('移動を取り消しました')};document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);document.addEventListener('keydown',key)}
function startCrop(){if(model.kind!=='image'||cropMode)return;cropBefore=structuredClone(model);crop={x:0,y:0,w:model.w,h:model.h};cropMode=true;drawObject()}
function finishCrop(commit){if(!cropMode)return;if(commit){remember();const rad=model.r*Math.PI/180,dx=crop.x+crop.w/2-model.w/2,dy=crop.y+crop.h/2-model.h/2;model.x+=model.w/2+dx*Math.cos(rad)-dy*Math.sin(rad)-crop.w/2;model.y+=model.h/2+dx*Math.sin(rad)+dy*Math.cos(rad)-crop.h/2;model.w=crop.w;model.h=crop.h;model.ix-=crop.x;model.iy-=crop.y}else model=structuredClone(cropBefore);cropMode=false;drawObject();notice(commit?'トリミングを確定しました。元画像は保持します。':'トリミングを取り消しました')}
$('crop').onclick=startCrop;$('crop-done').onclick=()=>finishCrop(true);$('crop-cancel').onclick=()=>finishCrop(false);
$('object-kind').onchange=e=>{finishCrop(false);remember();model.kind=e.target.value;drawObject()};$('reset-image').onclick=()=>{remember();finishCrop(false);Object.assign(model,{iw:model.w*1.2,ih:model.h*1.2,ix:-model.w*.1,iy:-model.h*.1});drawObject()};$('reset').onclick=()=>location.reload();$('undo').disabled=true;$('undo').onclick=()=>{const s=history.pop();if(!s)return;({pages,objects,selectedId}=JSON.parse(s));model=objects.find(o=>o.id===selectedId)||objects[0]||structuredClone(original);cropMode=false;$('object-kind').value=model.kind;buildPages();$('undo').disabled=!history.length};$('spread').onclick=()=>{joined=!joined;$('spread').classList.toggle('active',joined);buildPages()};
for(const b of document.querySelectorAll('[data-color]'))b.onclick=()=>{closePopup();popup=document.createElement('div');popup.className='popup palette';for(const color of ['#ffffff','#f7f1df','#f5e2aa','#eab36d','#de7873','#bc7baf','#759ecc','#467cc0','#315579','#23445b','#507c67','#172235']){const swatch=document.createElement('button');swatch.style.background=color;swatch.title=color;swatch.setAttribute('aria-label',color);swatch.onclick=()=>{remember();model[b.dataset.color]=color;drawObject();closePopup()};popup.append(swatch)}const r=b.getBoundingClientRect();placePopup(r.left,r.bottom+6)};
function drawViewer(){const stage=$('viewer-stage');stage.replaceChildren();let indexes=[viewerIndex];if(viewerSpread&&viewerIndex>0&&viewerIndex<pages.length-1){const first=viewerIndex%2?viewerIndex:viewerIndex-1;indexes=[first+1,first].filter(i=>i<pages.length-1)}for(const i of indexes){const clone=document.querySelector(`[data-id="${pages[i].id}"] .page`).cloneNode(true);clone.classList.remove('selected');clone.removeAttribute('tabindex');clone.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));stage.append(clone)}$('viewer-page').textContent=indexes.map(i=>pages[i].label).join(' / ');$('prev').disabled=viewerIndex===0;$('next').disabled=viewerIndex===pages.length-1}
$('preview').onclick=()=>{if(cropMode)finishCrop(true);viewerIndex=pages.findIndex(p=>p.graphic);drawViewer();$('viewer').showModal();notice('試作内の閲覧表示です。実装では編集中のスナップショットを通常のViewerで開きます。')};$('viewer-close').onclick=()=>$('viewer').close();$('prev').onclick=()=>{viewerIndex=Math.max(0,viewerIndex-1);drawViewer()};$('next').onclick=()=>{viewerIndex=Math.min(pages.length-1,viewerIndex+1);drawViewer()};$('viewer-spread').onclick=()=>{viewerSpread=!viewerSpread;$('viewer-spread').classList.toggle('active',viewerSpread);drawViewer()};
document.addEventListener('pointerdown',e=>{if(popup&&!popup.contains(e.target)&&!e.target.closest('[data-color]'))closePopup()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePopup();finishCrop(false)}if(e.key==='Enter'&&cropMode)finishCrop(true)});document.addEventListener('pointerover',e=>{const target=e.target.closest('[title]');if(!target)return;const tip=$('tooltip');tip.textContent=target.title;tip.hidden=false;const r=target.getBoundingClientRect();tip.style.left=clamp(r.left,8,innerWidth-310)+'px';tip.style.top=Math.min(r.bottom+7,innerHeight-45)+'px'});document.addEventListener('pointerout',()=>$('tooltip').hidden=true);document.addEventListener('pointerdown',()=>$('tooltip').hidden=true);
let selectedId='main',objects=[{...structuredClone(original),id:'back',kind:'shape',x:10,y:75,w:185,h:165,fill:'#eab36d'},{...model,id:'main'},{...structuredClone(original),id:'front',kind:'text',x:75,y:240,w:145,h:95,fill:'#f5e2aa'}];model=objects[1];let objectClipboard=null,activePageId='p3';
function syncModel(){const i=objects.findIndex(o=>o.id===selectedId);if(i>=0)objects[i]=model}
function selectObject(id){if(cropMode)finishCrop(true);syncModel();selectedId=id;model=objects.find(o=>o.id===id);activePageId=model.pageId||'p3';$('object-kind').value=model.kind;drawObject()}
function drawObject(){syncModel();const parent=$('strip');parent.querySelectorAll('.object').forEach(e=>e.remove());const active=model;for(let i=0;i<objects.length;i++){model=objects[i];const isSelected=model.id===selectedId,wasCrop=cropMode;cropMode=isSelected&&wasCrop;renderSingle();const el=$('object');el.id='object-'+model.id;el.dataset.objectId=model.id;el.style.zIndex=6+i;el.tabIndex=0;el.setAttribute('aria-label',({image:'画像',text:'テキストボックス',shape:'図形'})[model.kind]);if(!isSelected)el.querySelectorAll('.selection,.handle,.rotate').forEach(n=>n.remove());const id=model.id;el.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();selectObject(id);showObjectMenu(e.clientX,e.clientY)};el.onkeydown=e=>{if(e.key==='ContextMenu'||e.shiftKey&&e.key==='F10'){e.preventDefault();selectObject(id);const r=el.getBoundingClientRect();showObjectMenu(r.left+20,r.top+20)}};el.onpointerdown=e=>{if(e.button!==0)return;if(selectedId!==id)selectObject(id);objectDrag(e)};cropMode=wasCrop;}model=active;const selected=parent.querySelector(`[data-object-id="${selectedId}"]`);if(selected)selected.id='object';for(const b of document.querySelectorAll('[data-color]')){b.disabled=!selected;b.querySelector('i').style.background=selected?model[b.dataset.color]:'transparent';b.title=({fill:'塗りつぶし',stroke:'枠線',text:'文字色'})[b.dataset.color]+(selected?' · '+model[b.dataset.color]:'');}$('object-kind').disabled=!selected;$('crop').hidden=!selected||model.kind!=='image';$('reset-image').disabled=!selected||model.kind!=='image';$('crop').classList.toggle('active',cropMode);$('crop-done').hidden=$('crop-cancel').hidden=!cropMode;$('mode-hint').textContent=cropMode?'黒いハンドルで範囲を変更 · 画像をドラッグ · Enterで確定／Escで取消':'要素を右クリックでコピー／切り取り · 貼り付け先ページを右クリック';}
function reorderObject(action){remember();const page=model.pageId||'p3',local=objects.filter(o=>(o.pageId||'p3')===page),i=local.findIndex(o=>o.id===selectedId),[item]=local.splice(i,1);const at=action==='top'?local.length:action==='bottom'?0:action==='up'?Math.min(i+1,local.length):Math.max(0,i-1);local.splice(at,0,item);objects=objects.filter(o=>(o.pageId||'p3')!==page).concat(local);drawObject()}
function showObjectMenu(x,y){closePopup();popup=document.createElement('div');popup.className='popup object-menu';popup.setAttribute('role','menu');popup.setAttribute('aria-label',model.kind==='image'?'画像の操作':'要素の操作');const heading=document.createElement('div');heading.textContent=({image:'画像',text:'テキストボックス',shape:'図形'})[model.kind];heading.style.cssText='color:#99aac0;font-size:11px;padding:3px 8px 6px';popup.append(heading);function item(name,fn,disabled=false){const b=document.createElement('button');b.type='button';b.textContent=name;b.setAttribute('role','menuitem');b.disabled=disabled;b.onclick=()=>{closePopup();fn();notice(name+' — 試作に反映しました')};popup.append(b)}function sep(){const hr=document.createElement('hr');hr.style.cssText='border:0;border-top:1px solid #354359;margin:5px';popup.append(hr)}
item('切り取り',()=>copyObject(true));item('コピー',()=>copyObject(false));sep();if(model.kind==='image'){item('トリミング',startCrop);item('左右反転',()=>{remember();model.flip=!model.flip;drawObject()});sep()}const index=objects.findIndex(o=>o.id===selectedId),siblings=objects.filter(o=>(o.pageId||'p3')===(model.pageId||'p3')),localIndex=siblings.findIndex(o=>o.id===selectedId);item('最前面に移動',()=>reorderObject('top'),localIndex===siblings.length-1);item('前面に移動',()=>reorderObject('up'),localIndex===siblings.length-1);item('背面に移動',()=>reorderObject('down'),localIndex===0);item('最背面に移動',()=>reorderObject('bottom'),localIndex===0);if(model.kind==='image'){sep();item('画像のリセット',()=>{remember();finishCrop(false);Object.assign(model,{r:0,flip:false,iw:model.w*1.2,ih:model.h*1.2,ix:-model.w*.1,iy:-model.h*.1});drawObject()});item('画像の差し替え',replaceImage)}sep();item('複製',()=>{remember();const copy={...structuredClone(model),id:'copy'+Date.now(),x:model.x+16,y:model.y+16};objects.splice(index+1,0,copy);selectedId=copy.id;model=copy;drawObject()});item('削除',()=>{remember();objects.splice(index,1);selectedId=objects.at(-1)?.id||'';model=objects.at(-1)||structuredClone(original);cropMode=false;drawObject()});placePopup(x,y);const buttons=[...popup.querySelectorAll('button:not(:disabled)')];popup.onkeydown=e=>{let at=buttons.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();buttons[(at+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus()}if(e.key==='Escape'){e.stopPropagation();closePopup();$('object')?.focus()}};buttons[0]?.focus()}
function copyObject(cut){if(!objects.some(o=>o.id===selectedId))return;if(cropMode)finishCrop(true);objectClipboard={value:structuredClone(model),cutId:cut?selectedId:null};notice(cut?'移動先ページを右クリックして貼り付けてください':'コピーしました。別のページを右クリックして貼り付けできます')}
function pasteObject(pageId){if(!objectClipboard||!pages.some(p=>p.id===pageId))return;if(cropMode)finishCrop(true);remember();const copy={...structuredClone(objectClipboard.value),id:'paste'+Date.now(),pageId};if(objectClipboard.cutId)objects=objects.filter(o=>o.id!==objectClipboard.cutId);objects.push(copy);selectedId=copy.id;model=copy;activePageId=pageId;if(objectClipboard.cutId)objectClipboard=null;drawObject();$('object-kind').value=model.kind;notice('このページへ貼り付けました。位置・サイズ・トリミングを保持しています（試作）。')}
function showPasteMenu(e,pageId){closePopup();popup=document.createElement('div');popup.className='popup';popup.setAttribute('role','menu');const label=document.createElement('div');label.textContent=pages.find(p=>p.id===pageId)?.label;label.style.cssText='color:#99aac0;font-size:11px;padding:4px 8px';const b=document.createElement('button');b.textContent='貼り付け';b.setAttribute('role','menuitem');b.disabled=!objectClipboard;b.onclick=()=>{closePopup();pasteObject(pageId)};popup.append(label,b);placePopup(e.clientX,e.clientY)}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable=true]')||$('viewer').open)return;if((e.ctrlKey||e.metaKey)&&!e.altKey){const k=e.key.toLowerCase();if(k==='v'&&objectClipboard){e.preventDefault();pasteObject(activePageId)}else if((k==='c'||k==='x')&&!getSelection()?.toString()&&e.target.closest('.object')){e.preventDefault();copyObject(k==='x')}}});
function replaceImage(){const targetId=selectedId,input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>{const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{if(!objects.some(o=>o.id===targetId))return;selectObject(targetId);remember();const scale=Math.max(model.w/img.width,model.h/img.height);Object.assign(model,{src:reader.result,iw:img.width*scale,ih:img.height*scale,ix:(model.w-img.width*scale)/2,iy:(model.h-img.height*scale)/2});drawObject();notice('画像を差し替えました。試作内のみで使用します。')};img.onerror=()=>notice('この画像は読み込めませんでした');img.src=reader.result};reader.readAsDataURL(file)};input.click()}
buildPages();requestAnimationFrame(()=>{const p=document.querySelector('[data-id=p3]');$('viewport').scrollLeft=p.offsetLeft-$('viewport').clientWidth/2+120;if(new URLSearchParams(location.search).get('preview')==='crop')startCrop()});
</script></html>
