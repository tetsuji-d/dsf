<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSF WebMCP 書き込み検証</title>
<style>body{font:16px/1.6 system-ui;margin:30px auto;max-width:850px;padding:16px;color:#1c2d46;background:#f7f9fc}section{background:white;padding:20px;border:1px solid #aabace;margin:14px 0;border-radius:10px}button,select{font:inherit;margin:5px;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{margin-top:10px}</style>
<h1>WebMCP 段落書き込み検証</h1><p>合成原稿のみ。クラウド保存・認証・外部送信なし。本番と同じ登録・編集処理とUndo履歴を使用。</p>
<section id="controls"></section><section><label>本文言語<select id="language"><option>ja</option><option>en-GB</option><option>en-US</option></select></label>
<button id="undo">元に戻す</button><button id="redo">やり直す</button><button id="manual">手動変更を模擬</button><button id="switch">作品切替を模擬</button>
<pre id="text"></pre><p id="status" role="status"></p></section>
<section><h2>Chrome実APIの検証操作</h2><p>AI連携と書き込みをオンにしてから実行。Chrome 153のJSON引数形式用。合成原稿のpのみを編集します。</p>
<button id="list">段落一覧</button><button id="invalid">期限切れトークンを検証</button><button id="read">段落取得</button><button id="write">「灯台の明かり。」に更新</button><pre id="result"></pre></section>
<script type="module">
import {initStudioWebMCP,studioWebMCPMarkup} from '/js/studio-webmcp.js';
import {createFlowGroupBlock} from '/js/flow-project-model.js';
import {state} from '/js/state.js';
import {pushState,undo,redo,getHistoryInfo} from '/js/history.js';
let identity={},languageKey='ja',paragraph; const subscribers=new Set();
const sampleText=new URLSearchParams(location.search).has('multiline') ? '灯台のある町\n\n海辺の町に、小さな灯台がありました。\n\n夕暮れになると、灯台の光。遠くの船を静かに照らします。\n\n少年は港で、その光を眺めていました。\n\n明日も、この町には穏やかな朝が訪れるでしょう。' : '灯台の光。';
state.version=6; state.blocks=[createFlowGroupBlock({id:'sample',sourceLanguage:'ja',document:{sourceLanguage:'ja',sections:[{id:'s',blocks:[{id:'p',type:'paragraph',texts:{ja:sampleText,'en-GB':'A lighthouse.'}}]}]}})];
document.body.dataset.room='editor'; document.querySelector('#controls').innerHTML=studioWebMCPMarkup();
const render=()=>{document.querySelector('#text').textContent=JSON.stringify(state.blocks[0].flow.document.sections[0].blocks[0].texts,null,2);document.querySelector('#status').textContent=JSON.stringify(getHistoryInfo());};
initStudioWebMCP({getUILang:()=> 'ja',readState:()=>({room:'editor',workIdentity:identity,blocks:state.blocks,languageKeys:['ja','en-GB','en-US'],languageKey,activeGroupId:'sample',busy:false}),subscribeProjectSession:fn=>subscribers.add(fn),applyEdit:result=>{pushState();state.blocks=result.blocks;render();}});
document.querySelector('#language').onchange=e=>{languageKey=e.target.value;};
document.querySelector('#undo').onclick=()=>undo(render);document.querySelector('#redo').onclick=()=>redo(render);
document.querySelector('#manual').onclick=()=>{pushState();state.blocks[0].flow.document.sections[0].blocks[0].texts.ja='人が編集した原稿。';render();};
document.querySelector('#switch').onclick=()=>{identity={};subscribers.forEach(fn=>fn());};
async function call(name,args){const api=document.modelContext;const tool=(await api.getTools()).find(t=>t.name===name);if(!tool)throw Error('Tool unavailable');const raw=await api.executeTool(tool,JSON.stringify(args));return typeof raw==='string'?JSON.parse(raw):raw;}
const report=async fn=>{try{document.querySelector('#result').textContent=JSON.stringify(await fn(),null,2);}catch(e){document.querySelector('#result').textContent=e.message;}};
document.querySelector('#list').onclick=()=>report(async()=>{const ctx=await call('dsf_get_editor_context',{});return call('dsf_list_flow_paragraphs',{workToken:ctx.workToken});});
document.querySelector('#invalid').onclick=()=>report(()=>call('dsf_list_flow_paragraphs',{workToken:'expired'}));
document.querySelector('#read').onclick=()=>report(async()=>{const ctx=await call('dsf_get_editor_context',{});paragraph=await call('dsf_read_flow_paragraph',{workToken:ctx.workToken,groupId:'sample',sectionId:'s',blockId:'p',languageKey});return paragraph;});
document.querySelector('#write').onclick=()=>report(()=>call('dsf_replace_flow_paragraph',{workToken:paragraph?.workToken,editToken:paragraph?.editToken,text:paragraph?.text?.replace('灯台の光。','灯台の明かり。')}));render();
</script></html>
