<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSF 読書補助の試作</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#eef2f6;color:#263244;font:14px system-ui,sans-serif}header{padding:10px 16px;background:#fff;border-bottom:1px solid #cbd5e1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:16px;margin:0}button,select{font:inherit;min-height:34px;border:1px solid #b7c4d4;border-radius:7px;background:#fff;color:#263244;padding:5px 10px;cursor:pointer}button[aria-pressed=true]{background:#dbeafe;border-color:#2563eb;color:#1744a5}.modes{display:flex;gap:3px}label{display:flex;align-items:center;gap:6px}.help{padding:8px 16px;font-size:13px;margin:0;line-height:1.5}.workspace{height:calc(100dvh - 148px);min-height:300px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;max-width:1150px;margin:0 auto;padding:8px 16px 16px}.paper-host{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}.paper-shell{position:relative;flex:none}.paper{position:absolute;left:0;top:0;width:360px;height:640px;background:#f7f1df;color:#24211c;transform-origin:0 0;box-shadow:0 2px 16px #26324422;overflow:hidden;touch-action:none;outline:none}.paper:focus-visible{outline:2px solid #2563eb;outline-offset:3px}.text-line{position:absolute;width:24px;height:max-content;top:44px;font:18px/1.6 "Yu Mincho","Noto Serif JP",serif;writing-mode:vertical-rl;white-space:nowrap}.text-line ruby{ruby-position:over}.text-line rt{font-size:9px}.text-line em{font-style:normal;text-emphasis:dot}.text-line.active::after{content:"";position:absolute;left:-4px;top:0;height:100%;border-left:1px solid #137970}.paper[data-mode=focus] .text-line:not(.active){filter:blur(var(--blur,1.2px))}.paper[data-mode=lens] .text-line.active::after{border-color:#137970}.paper.horizontal .text-line{writing-mode:horizontal-tb;left:24px!important;width:310px;height:28px;white-space:nowrap;font:16px/1.6 Georgia,serif}.paper.horizontal .text-line.active::after{left:0;top:auto;bottom:-3px;height:0;width:100%;border-left:0;border-bottom:1px solid #137970}.page-label{position:absolute;bottom:12px;text-align:center;width:100%;font:12px system-ui;color:#6b655d}.side{min-height:0;display:flex;flex-direction:column;gap:10px}.side-title{display:flex;align-items:center;justify-content:space-between;gap:5px}.lens-window{position:relative;flex:1;overflow:hidden;background:#f7f1df;border:2px solid #137970;border-radius:10px;min-height:180px;pointer-events:none}.lens-window .paper{box-shadow:none;pointer-events:none}.lens-window .text-line{filter:none!important}.lens-window .text-line:not(.active){visibility:hidden}.lens-window .active::after{display:none}.lens-window::after{content:"";position:absolute;left:6px;right:6px;top:50%;border-top:1px dashed #13797055;pointer-events:none}.lens-note{background:#fff;border:1px solid #cad5df;padding:14px;border-radius:10px;line-height:1.8}.side[data-active=false] .lens-window{display:none}.side[data-active=true] .lens-note{display:none}.nav{display:flex;flex-direction:row-reverse;gap:6px;align-items:stretch}.nav button{flex:1;min-width:0;padding:5px 6px;white-space:nowrap}.side[data-writing=horizontal] .nav{flex-direction:column}.badge{font-size:11px;border-radius:4px;background:#e2e8f0;padding:3px 5px}footer{max-width:1150px;margin:auto;display:flex;gap:10px;justify-content:center;font-size:12px;padding:0 8px}input[type=range]{width:80px}
@media(max-width:650px){header{padding:8px;gap:7px}h1{font-size:14px}.modes button{padding:4px 7px}.help{font-size:12px;padding:6px 8px}.workspace{height:calc(100dvh - 230px);padding:4px 8px 8px;grid-template-columns:minmax(0,1fr) 125px;gap:8px}.side-title{font-size:12px;flex-wrap:wrap}.side-title select{padding:3px;min-height:28px}.lens-note{font-size:12px;padding:8px}.nav button{padding:4px 8px}footer{font-size:11px}}
</style>
<header><h1>DSF 読書補助 <span class="badge">試作</span></h1><div class="modes" role="group" aria-label="読書補助の方式"><button data-mode="guide" aria-pressed="false" title="細い線で読む行を示す">行ガイド</button><button data-mode="focus" aria-pressed="false" title="ほかの行を弱くぼかす">集中表示</button><button data-mode="lens" aria-pressed="true" title="指している位置をルビごと拡大する">拡大鏡</button></div><select id="writing" aria-label="書字方向"><option value="vertical">日本語・縦書きRTL</option><option value="horizontal">英語・横書きLTR</option></select><label id="blur-control" hidden>ぼかし<input id="blur" type="range" min="0.4" max="2.4" step="0.2" value="1.2"></label></header>
<p class="help" id="help">本文上でマウスを動かすと追従します。スマートフォンは本文をなぞって移動。次の行／前の行ボタンでも操作できます。</p>
<main class="workspace"><div class="paper-host"><div class="paper-shell"><div class="paper" id="paper" tabindex="0" aria-label="本文。上下矢印で前後の行に移動できます。"></div></div></div><aside class="side" data-active="true"><div class="side-title"><b id="side-title">拡大鏡</b><select id="zoom" aria-label="拡大倍率"><option value="1.5">1.5倍</option><option value="2" selected>2倍</option><option value="3">3倍</option></select></div><div class="lens-window" aria-hidden="true"></div><div class="lens-note" id="note"></div><div id="position" role="status" aria-live="polite"></div><div class="nav"><button id="prev" title="前の行">前の行</button><button id="next" title="次の行">次の行</button></div></aside></main><footer>比較用のサンプルです。作品の組版・保存内容は変わりません。拡大鏡中のページ送りは本体実装時に矢印へ分離します。</footer>
<script type="module">
const paper=document.querySelector('#paper'),shell=document.querySelector('.paper-shell'),host=document.querySelector('.paper-host'),lens=document.querySelector('.lens-window'),side=document.querySelector('.side');
const jp=['<ruby>離<rt>はな</rt></ruby>れたホテルの一室は、静かな朝を迎えた。','窓の向こうには、<ruby>立河<rt>たちかわ</rt></ruby>の街が広がっている。','千佳は副社長として、<em>大切な約束</em>を守ろうとした。','<ruby>静寂<rt>せいじゃく</rt></ruby>の中に、遠くの波の音が聞こえていた。','目を上げると、机には一通の手紙が置かれていた。','「また会える日を、楽しみにしています」','その言葉を、彼女はもう一度ゆっくり読み返した。'];
const en=['Morning light filled the quiet room.','Beyond the window lay the harbour.','Chika carefully opened the letter.','“We will meet again by the sea.”','She read these words once more.','A gentle breeze moved the curtain.','The day was only just beginning.','The promise remained in her heart.','She placed the letter on the desk.','Outside, the city was waking up.','There was still time for a new start.'];
let mode='lens',active=0,vertical=true,scale=1,point={x:316,y:150},clone=null;
function build(){side.dataset.writing=vertical?'vertical':'horizontal';paper.classList.toggle('horizontal',!vertical);paper.innerHTML=(vertical?jp:en).map((text,i)=>`<div class="text-line" data-index="${i}" style="${vertical?'left:'+(306-i*42)+'px':'top:'+(48+i*44)+'px'}">${text}</div>`).join('')+'<div class="page-label">1 · 読書補助サンプル</div>';active=0;point=vertical?{x:318,y:155}:{x:110,y:62};clone=paper.cloneNode(true);clone.removeAttribute('id');clone.removeAttribute('tabindex');clone.removeAttribute('aria-label');clone.setAttribute('aria-hidden','true');clone.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));lens.replaceChildren(clone);select(0);resize();}
function select(index){const lines=[...paper.querySelectorAll('.text-line')];active=Math.max(0,Math.min(index,lines.length-1));lines.forEach((l,i)=>l.classList.toggle('active',i===active));clone?.querySelectorAll('.text-line').forEach((l,i)=>l.classList.toggle('active',i===active));const l=lines[active];if(vertical)point.x=parseFloat(l.style.left)+17;else point.y=parseFloat(l.style.top)+9;document.querySelector('#position').textContent=`${active+1} / ${lines.length} 行`;document.querySelector('#prev').disabled=active===0;document.querySelector('#next').disabled=active===lines.length-1;updateLens();}
function resize(){scale=Math.min((host.clientWidth-4)/360,(host.clientHeight-4)/640);shell.style.width=360*scale+'px';shell.style.height=640*scale+'px';paper.style.transform=`scale(${scale})`;updateLens();}
function updateLens(){if(!clone)return;const z=Number(document.querySelector('#zoom').value)*scale;const tx=Math.min(0,Math.max(lens.clientWidth-360*z,lens.clientWidth/2-point.x*z)),ty=Math.min(0,Math.max(lens.clientHeight-640*z,lens.clientHeight/2-point.y*z));clone.style.transform=`translate(${tx}px,${ty}px) scale(${z})`;}
function setMode(next){mode=next;paper.dataset.mode=mode;side.dataset.active=String(mode==='lens');document.querySelectorAll('[data-mode]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',String(b.dataset.mode===mode));});document.querySelector('#blur-control').hidden=mode!=='focus';document.querySelector('#zoom').hidden=mode!=='lens';document.querySelector('#side-title').textContent={guide:'行ガイド',focus:'集中表示',lens:'拡大鏡'}[mode];document.querySelector('#note').textContent=mode==='focus'?'読んでいる行と、そのルビ・圏点は鮮明なまま。ほかの行だけを弱くぼかします。':'縦書きは左側、横書きは下に細い線を出します。本文には色を重ねません。';resize();}
function follow(event){const r=paper.getBoundingClientRect();point={x:Math.max(0,Math.min(360,(event.clientX-r.left)/scale)),y:Math.max(0,Math.min(640,(event.clientY-r.top)/scale))};const lines=[...paper.querySelectorAll('.text-line')];let best=0,d=Infinity;lines.forEach((l,i)=>{const dist=vertical?Math.abs(point.x-(parseFloat(l.style.left)+12)):Math.abs(point.y-(parseFloat(l.style.top)+14));if(dist<d){d=dist;best=i}});select(best);}
paper.addEventListener('pointerdown',e=>{paper.focus({preventScroll:true});paper.setPointerCapture(e.pointerId);follow(e);e.preventDefault()});paper.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons){follow(e);e.preventDefault()}});paper.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();select(active+(e.key==='ArrowDown'?1:-1))}});
document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.querySelector('#writing').onchange=e=>{vertical=e.target.value==='vertical';build()};document.querySelector('#prev').onclick=()=>select(active-1);document.querySelector('#next').onclick=()=>select(active+1);document.querySelector('#zoom').onchange=updateLens;document.querySelector('#blur').oninput=e=>paper.style.setProperty('--blur',e.target.value+'px');new ResizeObserver(resize).observe(host);build();setMode(mode);
</script></html>
