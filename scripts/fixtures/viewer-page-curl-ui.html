<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DSF 曲面めくり比較試作</title><style>
*{box-sizing:border-box}body{margin:0;background:#13151a;color:#eef1f6;font:14px system-ui}button,select{font:inherit;color:inherit;background:#292d37;border:1px solid #596174;border-radius:8px;min-height:44px;padding:8px 12px}button{cursor:pointer}button:disabled{opacity:.35}header{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:12px}main{display:flex;align-items:center;justify-content:center;gap:40px;min-height:calc(100dvh - 150px);padding:16px}.notes{width:260px;line-height:1.9}.notes h1{font-size:23px}.notes small{color:#adb8cc}.stage{--w:min(40vw,330px);width:var(--w);height:calc(var(--w)*16/9);position:relative;perspective:1700px;touch-action:none;user-select:none;isolation:isolate}.page{position:absolute;inset:0;background:#f6efd9;color:#28251e;overflow:hidden;box-shadow:0 1px 12px #0006}.sheet{position:absolute;inset:0;transform-style:preserve-3d;z-index:3;transform-origin:left center}.stage[data-dir=rtl] .sheet{transform-origin:right center}.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}.back{transform:rotateY(180deg);background:#eee5cd}.body{position:absolute;inset:7% 9% 9%;font-family:serif;font-size:clamp(13px,1.6vw,18px);line-height:1.95}.vertical{writing-mode:vertical-rl}.body h2{font-size:1.2em;margin:0 0 12px}.body p{margin:0 0 1em}.folio{position:absolute;bottom:12px;left:0;right:0;text-align:center;font:11px system-ui}.back:after,.front:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0007,transparent 35%,#fff2);opacity:var(--shade,0)}.under:after{content:'';position:absolute;inset:0;background:#000;opacity:var(--shadow,0);pointer-events:none}.art{background:linear-gradient(160deg,#769cb9,#c0d1cc 48%,#384f64 49%,#142d42 68%,#b2a586);color:white}.art:before{content:'';position:absolute;width:40%;aspect-ratio:1;background:#ffe6a7;border-radius:50%;left:15%;top:18%;box-shadow:0 0 50px #ffe9a966}.art .body{text-shadow:0 2px 5px #000;font-size:24px;display:flex;align-items:flex-end}.art .folio{color:white}.edge{position:absolute;top:0;bottom:0;width:8%;right:0;z-index:5;background:linear-gradient(90deg,transparent,#226eea26);pointer-events:none}.stage[data-dir=rtl] .edge{right:auto;left:0;transform:scaleX(-1)}footer{display:flex;justify-content:center;align-items:center;gap:16px;padding:14px 12px max(28px,calc(env(safe-area-inset-bottom) + 16px))}output{min-width:70px;text-align:center}#hint{text-align:center;color:#b4c6df;min-height:24px}button:focus-visible,select:focus-visible,.stage:focus-visible{outline:2px solid #8abaff;outline-offset:4px}@media(max-width:650px){header{padding-top:max(10px,env(safe-area-inset-top));font-size:12px}main{padding:8px;min-height:0}.notes{display:none}.stage{--w:min(72vw,calc((100dvh - 220px)*9/16));}.body{font-size:15px}footer{padding-top:8px}header strong{display:none}}@media(prefers-reduced-motion:reduce){.sheet{will-change:auto}}

.curl{position:absolute;inset:0;transform-style:preserve-3d;z-index:4;pointer-events:none}.strip{position:absolute;top:0;height:100%;transform-origin:0 50%;transform-style:preserve-3d}.strip-face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#f6efd9}.strip-back{transform:rotateY(180deg);background:#eee5cd}.strip-face .page{height:100%;box-shadow:none;max-width:none}.strip-face:after{content:'';position:absolute;inset:0;background:#30210a;opacity:var(--strip-shadow,0);pointer-events:none}.stage[data-render=curve][data-turning=true]>.sheet{visibility:hidden}.stage:not([data-turning=true])>.curl,.stage:not([data-turning=true])>.under,.stage[data-render=flat]>.curl{display:none}.stage>.edge{display:none}#metrics{font:11px system-ui;color:#a5b7ca;text-align:center;min-height:20px}
</style><header><strong>DSF · 裏面付きめくり試作</strong><select id="dir" aria-label="ページ方向"><option value="rtl">日本語・RTL</option><option value="ltr">English・LTR</option></select><select id="kind" aria-label="ページ内容"><option value="text">本文</option><option value="image">画像風サンプル</option></select><select id="render" aria-label="めくり方式"><option value="curve">曲面・24分割</option><option value="flat">平面（比較）</option></select><select id="speed" aria-label="速度"><option value="1">通常速度</option><option value="3">スロー</option></select></header><main><div class="stage" data-dir="rtl" tabindex="0" role="region" aria-label="ページ端からドラッグしてめくる"><div class="page under"></div><div class="sheet"><div class="page face front"></div><div class="page face back"></div></div><div class="curl" aria-hidden="true"></div><div class="edge"></div></div><aside class="notes"><h1>紙の裏側を見ながら<br>めくる。</h1><p>RTLは左端、LTRは右端からドラッグ。半分ほど進めて離すと確定、手前なら元に戻ります。</p><p>裏側には次のページを表示します。半回転すると裏面が見え、確定後に画面中央へ移ります。</p><small>単ページ向けの動作確認です。24本の帯で曲面を近似します。平面との比較とスロー再生ができます。前へボタンは瞬時切替です。実Viewerと保存データには影響しません。</small></aside></main><div id="metrics" aria-live="polite">操作後に描画間隔を表示（このブラウザの参考値）</div><div id="hint" role="status">左端から右へドラッグ</div><footer><button id="prev">前へ</button><output id="count"></output><button id="next">次へ</button></footer><script>
const $=s=>document.querySelector(s),stage=$('.stage'),sheet=$('.sheet');let page=1,progress=0,drag=null,busy=false,animation=null;
let strips=[],paperWidth=0,samples=[],lastFrame=0;
const total=8,reduced=matchMedia('(prefers-reduced-motion: reduce)');
function content(n){if(n>total)return '';const rtl=$('#dir').value==='rtl';if($('#kind').value==='image')return '<div class="body"><h2>'+ (rtl?'海辺の記憶':'By the sea')+'<br>'+n+'</h2></div><div class="folio">'+n+' / '+total+'</div>';return '<div class="body '+(rtl?'vertical':'')+'"><h2>'+(rtl?'第'+n+'章　海辺の手紙':'Chapter '+n+' · A letter')+'</h2><p>'+(rtl?'朝の光が、静かな部屋に差し込んだ。窓の向こうには海が広がっている。':'Morning light filled the quiet room. Beyond the window lay the sea.')+'</p><p>'+(rtl?'一枚の紙をめくると、そこには新しい物語が待っていた。遠い日の約束を思い出し、彼女はゆっくり読み進めた。':'Turning a page, she found a new story waiting. She remembered an old promise and continued reading.')+'</p></div><div class="folio">'+n+' / '+total+'</div>';}
function paint(){stage.dataset.dir=$('#dir').value;for(const [sel,n] of [['.front',page],['.back',page+1],['.under',page+2]]){const el=$(sel);el.innerHTML=content(n);el.classList.toggle('art',$('#kind').value==='image'&&n<=total);}$('#count').textContent=page+' / '+total;$('#prev').disabled=busy||page===1;$('#next').disabled=busy||page===total;buildStrips();setProgress(0);$('#hint').textContent=page===total?'最後のページ':stage.dataset.dir==='rtl'?'左端から右へドラッグ':'右端から左へドラッグ';}
function buildStrips(){paperWidth=stage.clientWidth;stage.dataset.render=$('#render').value;const root=$('.curl');root.replaceChildren();strips=[];const w=paperWidth/24;for(let i=0;i<24;i++){const el=document.createElement('div');el.className='strip';el.style.width=(w+.35)+'px';for(const back of [false,true]){const face=document.createElement('div');face.className='strip-face'+(back?' strip-back':'');const pageNode=$(back?'.sheet>.back':'.sheet>.front').cloneNode(true);pageNode.className='page'+(pageNode.classList.contains('art')?' art':'');pageNode.style.width=paperWidth+'px';const originalX=stage.dataset.dir==='rtl'?paperWidth-(i+1)*w:i*w;pageNode.style.left=-(back?paperWidth-originalX-w:originalX)+'px';face.append(pageNode);el.append(face);}root.append(el);strips.push(el);}}
function curve(p){const rtl=stage.dataset.dir==='rtl',sign=rtl?1:-1,w=paperWidth/24;let x=rtl?paperWidth:0,z=0;for(let i=0;i<24;i++){const t=(i+.5)/24;const angle=Math.PI*p+Math.sin(Math.PI*p)*.7*(t-.5);const nx=x+(rtl?-1:1)*Math.cos(angle)*w,nz=z+Math.sin(angle)*w;const px=(rtl?nx:x)-sign*paperWidth*p,pz=rtl?nz:z;strips[i].style.transform='translate3d('+px+'px,0,'+pz+'px) rotateY('+(sign*angle)+'rad)';strips[i].style.setProperty('--strip-shadow',Math.abs(Math.sin(angle))*.22);x=nx;z=nz;}}
function setProgress(p){progress=Math.max(0,Math.min(1,p));stage.dataset.turning=String(progress>0&&progress<1);const sign=stage.dataset.dir==='rtl'?1:-1;sheet.style.transform='translateX('+(-sign*stage.clientWidth*progress)+'px) rotateY('+sign*180*progress+'deg)';sheet.style.setProperty('--shade',Math.sin(progress*Math.PI)*.7);$('.under').style.setProperty('--shadow',Math.sin(progress*Math.PI)*.25);if(strips.length&&stage.dataset.render==='curve')curve(progress);if(progress===0){sheet.style.transform='none';sheet.style.setProperty('--shade','0');$('.under').style.setProperty('--shadow','0');for(const strip of strips)strip.style.setProperty('--strip-shadow','0');}}
async function settle(commit){busy=true;$('#dir').disabled=$('#kind').disabled=$('#render').disabled=$('#speed').disabled=true;$('#prev').disabled=$('#next').disabled=true;const start=progress,target=commit?1:0,duration=reduced.matches?0:Math.max(180,520*Math.abs(target-start))*Number($('#speed').value);const stamp=performance.now();samples=[];lastFrame=0;await new Promise(resolve=>{function frame(now){if(lastFrame)samples.push(now-lastFrame);lastFrame=now;const t=duration?Math.min(1,(now-stamp)/duration):1;setProgress(start+(target-start)*(1-Math.pow(1-t,3)));if(t<1)animation=requestAnimationFrame(frame);else resolve();}frame(stamp);});if(samples.length){const sorted=[...samples].sort((a,b)=>a-b);$('#metrics').textContent='描画間隔 中央値 '+sorted[Math.floor(sorted.length/2)].toFixed(1)+' ms ／最大 '+Math.max(...samples).toFixed(1)+' ms（この端末の参考値）';}if(commit)page++;busy=false;$('#dir').disabled=$('#kind').disabled=$('#render').disabled=$('#speed').disabled=false;paint();}
stage.onpointerdown=e=>{if(busy||page===total||e.isPrimary===false||e.button>0)return;const r=stage.getBoundingClientRect(),x=e.clientX-r.left;if(stage.dataset.dir==='rtl'?x>r.width*.3:x<r.width*.7)return;drag={id:e.pointerId,x:e.clientX,width:r.width};stage.setPointerCapture(e.pointerId);e.preventDefault();};
stage.onpointermove=e=>{if(drag?.id!==e.pointerId)return;setProgress((e.clientX-drag.x)*(stage.dataset.dir==='rtl'?1:-1)/(drag.width*1.5));e.preventDefault();};
stage.onpointerup=e=>{if(drag?.id!==e.pointerId)return;drag=null;settle(progress>.45);};stage.onpointercancel=()=>{if(drag){drag=null;settle(false);}};
$('#next').onclick=()=>{if(!busy&&page<total)settle(true);};$('#prev').onclick=()=>{if(!busy&&page>1){page--;paint();}};
for(const id of ['dir','kind','render','speed'])$('#'+id).onchange=()=>{if(busy){$('#'+id).blur();return;}drag=null;paint();};
stage.onkeydown=e=>{if(e.key==='Escape'&&drag){drag=null;settle(false);}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const next=e.key===(stage.dataset.dir==='rtl'?'ArrowLeft':'ArrowRight');$(next?'#next':'#prev').click();}};
new ResizeObserver(()=>{if(!busy&&!drag){buildStrips();setProgress(progress);}}).observe(stage);
paint();
</script></html>
