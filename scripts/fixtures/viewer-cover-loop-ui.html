<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DSF 表紙から裏表紙へ</title><link rel="stylesheet" href="./viewer-cover-loop-ui.css"></head>
<body><header><a href="/viewer" class="brand">DSF <span>Viewer試作</span></a><div class="settings"><label>綴じ方向 <select id="binding"><option value="rtl">右綴じ</option><option value="ltr">左綴じ</option></select></label><label>表示 <select id="mode"><option value="single">単ページ</option><option value="spread">見開き</option></select></label></div></header>
<main><aside><span class="eyebrow">表紙の、その向こうへ</span><h1>逆に送ると、<br>裏表紙へ。</h1><p>表紙を逆方向へスワイプすると、背表紙で一旦停止。指を離してもう一度送ると裏表紙へ。マウスのドラッグ・二本指の横スクロールでも試せます。ボタンも1回目で背表紙に止まり、2回目で裏返ります。逆方向のボタンで戻せます。</p><ol><li>表紙 <span>C1</span></li><li>裏表紙 <span>C4</span></li><li>裏表紙の内側 <span>C3</span></li><li>本文の最終ページ</li></ol><button id="reset">表紙から試す</button><p><a href="/viewer?src=/scripts/fixtures/viewer-cover-loop-book.json" style="color:#c4e1d4">Viewer本体で試す（PC全画面対応）</a></p><p class="note">架空の本を使った操作の試作です。既存の作品や読書位置は変更しません。</p></aside>
<section class="reader" aria-label="試作ビューワー"><div id="viewer-stage"><div id="canvas" tabindex="0" role="region" aria-label="本のページ。左右の矢印キーまたはスワイプで移動"></div></div>
<nav aria-label="ページ送り"><div class="position"><span id="role"></span><output id="counter"></output></div><input id="progress" type="range" min="0" max="9" value="0" aria-label="ページ位置"><div class="buttons"><button id="left"></button><span id="hint" aria-live="polite"></span><button id="right"></button></div></nav></section></main>
<script type="module" src="./viewer-cover-loop-ui.js"></script></body></html>
