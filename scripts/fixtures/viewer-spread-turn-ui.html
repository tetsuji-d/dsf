<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DSF 単ページ・見開きのめくり</title><style>
*{box-sizing:border-box}body{margin:0;background:#151923;color:#eef2f9;font:14px system-ui}header,footer{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:12px}button,select{font:inherit;color:inherit;background:#293142;border:1px solid #66748c;min-height:44px;padding:6px 12px;border-radius:8px}button:disabled{opacity:.35}button{cursor:pointer}button:focus-visible,select:focus-visible,.viewport:focus-visible{outline:2px solid #9ad6ff;outline-offset:3px}.viewport{position:relative;margin:12px auto;width:min(90vw,780px);height:min(64dvh,590px);overflow:hidden;touch-action:none;user-select:none;background:#0c1018;border:1px solid #3e4c61;border-radius:12px;perspective:1600px}.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}.book{position:absolute;transform-style:preserve-3d;top:0;left:0}.page{position:absolute;top:0;width:var(--pw);height:var(--ph);overflow:hidden;background:var(--color);color:#26364c;border:1px solid #26364c28;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}.page b{font:600 clamp(80px,16vw,170px)/1 system-ui}.page small{font-size:15px}.page p{font:18px serif;writing-mode:vertical-rl;position:absolute;top:8%;right:10%;margin:0}.left{left:calc(-1 * var(--pw))}.right{left:0}.sheet{position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);transform-origin:0 50%;transform-style:preserve-3d;z-index:4}.face{inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}.back{transform:rotateY(180deg)}.sheet .page:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0008,transparent 45%);opacity:var(--shade,0);pointer-events:none}.shadow{position:absolute;top:0;left:calc(-1 * var(--pw));width:calc(2 * var(--pw));height:var(--ph);background:linear-gradient(90deg,transparent,#0005,transparent);opacity:var(--shadow,0);pointer-events:none}.label{text-align:center;line-height:1.7;margin:8px auto;max-width:700px;padding:0 12px;color:#bdd0e6}.status{font-size:16px;color:white;min-height:27px}footer{padding-bottom:max(28px,calc(env(safe-area-inset-bottom) + 16px))}.legend{font-size:12px;color:#9babc4}#scrub{width:min(80vw,540px);accent-color:#97cfff;display:block;margin:14px auto}header{padding-top:max(12px,env(safe-area-inset-top))}@media(max-width:600px){.viewport{width:100vw;border-radius:0;border-left:0;border-right:0;height:60dvh;margin:4px auto}.legend{font-size:11px}header{font-size:12px;padding-bottom:4px}}

[hidden]{display:none!important}.curl{position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:5;pointer-events:none}.strip{position:absolute;top:0;height:100%;transform-origin:0 50%;transform-style:preserve-3d}.strip-face{position:absolute;top:0;bottom:0;left:-1.25px;right:-1.25px;overflow:hidden;background:var(--paper-color);backface-visibility:hidden;-webkit-backface-visibility:hidden}.strip-back{transform:rotateY(180deg)}.strip-face>.page{left:var(--crop);width:var(--pw);height:var(--ph);border:0}.strip-face:after{content:'';position:absolute;inset:0;background:#18202b;opacity:var(--shade,0);pointer-events:none}
</style><header><strong>DSF 動きの確認</strong><select id="mode" aria-label="表示"><option value="single">単ページ</option><option value="spread">2ページ見開き</option></select><select id="speed" aria-label="速度"><option value="1">通常</option><option value="3">スロー</option></select></header><div class="viewport" tabindex="0" role="region" aria-label="左右にドラッグしてページを移動"><div class="world"><div class="book"><div class="page left"></div><div class="page right"></div><div class="shadow"></div><div class="curl" hidden aria-hidden="true"></div><div class="sheet"><div class="page face front"></div><div class="page face back"></div></div></div></div></div><p class="label status" id="status" aria-live="polite"></p><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="めくり進行位置"><p class="label legend">右綴じ：右へドラッグ＝次へ ／ 左へ＝前へ<br>途中で戻せます。スライダーで動きを止めて重なりを確認できます。</p><footer><button id="prev">← 前へ</button><button id="next">次へ →</button></footer><p class="label legend">曲面・裏面・影を統合した試作です。静止時は分割のないページに戻します。<br>単ページは 1 → 2（横移動）→ 3（めくり）→ 4（横移動）の順です。</p><script>
const $=s=>document.querySelector(s),vp=$('.viewport'),world=$('.world'),sheet=$('.sheet');let current=2,start=2,target=3,p=0,w=260,h=462,drag=null,busy=false,preview=false,kind='turn',base=0;
let strips=[];
const reduced=matchMedia('(prefers-reduced-motion:reduce)');const color=n=>['#e9dac1','#d4e7f1','#dfecd7','#f1d9dc'][((n-1)%4+4)%4];
function page(el,n){el.style.setProperty('--color',color(n));el.innerHTML='<b>'+n+'</b><small>ページ '+n+'</small><p>海辺の手紙</p>';}
function pair(n){return Math.floor((n-1)/2)*2;}function center(n){return n%2?w/2:-w/2;}
function configure(a,b){start=a;target=b;p=0;kind=$('#mode').value==='spread'||pair(a)!==pair(b)?'turn':'slide';base=kind==='turn'?Math.min(pair(a),pair(b)):pair(a);if(kind==='turn'){page($('.left'),base+4);page($('.right'),base+1);page($('.front'),base+3);page($('.back'),base+2);buildCurl();sheet.hidden=true;}else{page($('.left'),base+2);page($('.right'),base+1);sheet.hidden=true;$('.curl').hidden=true;}}
function buildCurl(){const root=$('.curl');root.replaceChildren();strips=[];const sw=w/24;for(let i=0;i<24;i++){const strip=document.createElement('div');strip.className='strip';strip.style.width=sw+'px';for(const back of [false,true]){const face=document.createElement('div');face.className='strip-face'+(back?' strip-back':'');const source=$(back?'.sheet>.back':'.sheet>.front');face.style.setProperty('--paper-color',source.style.getPropertyValue('--color'));const clone=source.cloneNode(true);clone.className='page';clone.style.setProperty('--crop',(1.25-(back?w-(i+1)*sw:i*sw))+'px');face.append(clone);strip.append(face);}root.append(strip);strips.push(strip);}}
function curve(q){let x=0,z=0;const sw=w/24;$('.curl').hidden=false;for(let i=0;i<24;i++){const angle=-Math.PI*(1-q)+Math.sin(Math.PI*q)*.8*((i+.5)/24-.5);const strip=strips[i];strip.style.transform='translate3d('+x+'px,0,'+z+'px) rotateY('+angle+'rad)';strip.style.setProperty('--shade',Math.abs(Math.sin(angle))*.2);x+=Math.cos(angle)*sw;z-=Math.sin(angle)*sw;}}
function draw(t){p=Math.max(0,Math.min(1,t));const forward=target>start,q=kind==='turn'?(forward?p:1-p):0;let view=0,scale=1;if(kind==='turn')curve(q);
if($('#mode').value==='single'){view=center(start)+(center(target)-center(start))*p;scale=1-.14*Math.sin(Math.PI*p);}
world.style.transform='translateX('+(-view*scale)+'px) scale('+scale+')';$('.book').style.top=(-h/2)+'px';sheet.style.transform='rotateY('+(-180*(1-q))+'deg)';sheet.style.setProperty('--shade',Math.sin(Math.PI*p)*.5);$('.shadow').style.setProperty('--shadow',kind==='turn'?Math.sin(Math.PI*p)*.5:0);$('#scrub').value=Math.round(p*1000);$('#status').textContent=p>0&&p<1?(start+' → '+target+' ／ '+(kind==='turn'?'紙をめくる':'隣へ横移動')):$('#mode').value==='spread'?('左 '+(pair(current)+2)+' ｜ 右 '+(pair(current)+1)):('ページ '+current);}
function idle(){$('.curl').hidden=true;const b=pair(current);page($('.left'),b+2);page($('.right'),b+1);sheet.hidden=true;p=0;preview=false;world.style.transform='translateX('+($('#mode').value==='single'?-center(current):0)+'px)';$('.book').style.top=(-h/2)+'px';$('.shadow').style.setProperty('--shadow',0);$('#scrub').value=0;$('#status').textContent=$('#mode').value==='spread'?'左 '+(b+2)+' ｜ 右 '+(b+1):'ページ '+current;$('#prev').disabled=current===1;$('#next').disabled=current>=8;}
function resize(){h=Math.min(vp.clientHeight-16,($('#mode').value==='spread'?(vp.clientWidth-16)/2:vp.clientWidth-16)*16/9);w=h*9/16;vp.style.setProperty('--pw',w+'px');vp.style.setProperty('--ph',h+'px');if(preview){if(kind==='turn')buildCurl();draw(p);}else idle();}
function destination(dir){return Math.max(1,Math.min(8,current+dir*($('#mode').value==='spread'?2:1)));}
function begin(dir){const dest=destination(dir);if(dest===current)return false;configure(current,dest);preview=true;draw(0);return true;}
async function settle(commit){busy=true;$('#mode').disabled=$('#speed').disabled=true;$('#prev').disabled=$('#next').disabled=true;const from=p,to=commit?1:0,time=reduced.matches?0:Math.max(120,650*Math.abs(to-from))*Number($('#speed').value),stamp=performance.now();await new Promise(done=>{function frame(now){const t=time?Math.min(1,(now-stamp)/time):1;draw(from+(to-from)*(t*t*(3-2*t)));if(t<1)requestAnimationFrame(frame);else done();}frame(stamp);});if(commit)current=target;busy=false;$('#mode').disabled=$('#speed').disabled=false;idle();}
vp.onpointerdown=e=>{if(busy||e.button>0)return;if(preview)idle();drag={id:e.pointerId,x:e.clientX,dir:0};vp.setPointerCapture(e.pointerId);};vp.onpointermove=e=>{if(drag?.id!==e.pointerId)return;const dx=e.clientX-drag.x;if(!drag.dir&&Math.abs(dx)>5){drag.dir=dx>0?1:-1;if(!begin(drag.dir)){drag=null;return;}}if(drag.dir)draw(dx*drag.dir/Math.max(80,w*.8));};vp.onpointerup=e=>{if(drag?.id!==e.pointerId)return;const valid=drag.dir;drag=null;if(valid)settle(p>.4);};vp.onpointercancel=()=>{drag=null;if(preview&&!busy)settle(false);};
$('#next').onclick=()=>{if(!busy&&begin(1))settle(true);};$('#prev').onclick=()=>{if(!busy&&begin(-1))settle(true);};$('#mode').onchange=()=>{preview=false;resize();};$('#scrub').oninput=e=>{if(busy)return;const value=Number(e.target.value)/1000;if(!preview&&!begin(current<8?1:-1))return;draw(value);};$('#scrub').onchange=()=>{if(preview&&!busy)settle(p>.4);};vp.onkeydown=e=>{if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click();if(e.key==='Escape'&&preview&&!busy){drag=null;settle(false);}};new ResizeObserver(resize).observe(vp);resize();
</script></html>
