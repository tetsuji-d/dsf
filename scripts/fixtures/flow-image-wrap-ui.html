<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSF · Flow画像と回り込み</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#172235;--line:#354359;--text:#e4edf9;--blue:#75adff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui;height:100vh;display:flex;flex-direction:column}button,select,input{font:inherit}button,select{color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 9px;cursor:pointer}button:hover{border-color:var(--blue)}button:focus-visible,select:focus-visible{outline:2px solid var(--blue)}button[aria-pressed=true]{background:#234b7d;border-color:var(--blue)}header{padding:9px 15px;background:#080f19;display:flex;gap:24px;align-items:center}header strong{color:var(--blue)}header small{margin-left:auto;color:#e6c685}.project,.tools,.demo{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.project{font-size:12px}.muted{color:#a4b4ca}.sep{height:25px;border-left:1px solid var(--line);margin:0 4px}.icon{font-size:19px;min-width:35px;padding:2px 8px}.demo{background:#1d293c;font-size:12px}.demo label{display:flex;align-items:center;gap:9px}.demo input{width:135px;accent-color:#75adff}.workspace{flex:1;min-height:0;overflow:auto;background:#252c37}.strip{display:flex;gap:27px;padding:32px 38px;width:max-content;min-width:100%;justify-content:center}.slot{width:324px;flex:none}.page{width:324px;height:576px;background:#f7f1df;color:#352e27;position:relative;box-shadow:0 3px 12px #0006}.page.active{outline:2px solid #75adff;outline-offset:3px}.cell{position:absolute;font:14px/20px 'Yu Mincho',serif;white-space:pre;pointer-events:none}.cell.anchor{background:#b2d3f788;color:#152d48}.anchor-tag{position:absolute;left:4px;top:5px;font-size:11px;color:#235da4;background:#e1edfa;padding:3px 5px;border-radius:3px;cursor:pointer}.art{position:absolute;cursor:move;touch-action:none;z-index:3;border:0;background:#8ec0c6;padding:0;border-radius:0;outline:2px solid #287aff}.art svg{width:100%;height:100%;display:block}.art.shape{background:#b6d5e8;border:3px solid #477c9e;border-radius:18px}.art.shape svg{visibility:hidden}.handle{position:absolute;width:9px;height:9px;background:white;border:1px solid #287aff}.nw{left:-5px;top:-5px}.ne{right:-5px;top:-5px}.sw{left:-5px;bottom:-5px}.se{right:-5px;bottom:-5px;cursor:nwse-resize}.halo{position:absolute;border:1px dashed #539bcd;background:#77baff0a;pointer-events:none;z-index:2}.connector{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}.caption{text-align:center;padding:9px}.group{text-align:center;border:1px solid #526e93;background:#30435f;padding:3px;font-size:11px;color:#cfe2ff}.status{padding:10px 15px;min-height:43px;border-top:1px solid var(--line);color:#bbd8ff}.legend{margin-left:auto}button:disabled{opacity:.4;cursor:default}@media(max-width:1050px){.strip{justify-content:flex-start}}.unselected .handle,.unselected .halo,.unselected .connector,.unselected .anchor-tag{display:none}.unselected .art{outline:none}.unselected .cell.anchor{background:transparent;color:inherit}
</style>
<header><strong>DSF Studio</strong><span>エディター</span><small>UI試作 · 保存されません</small></header>
<div class="project"><span title="プロジェクト設定">▤</span><b>港町の手紙</b><span class="muted">Flow画像の回り込み</span><span class="legend muted">JA · 9:16</span></div>
<div class="tools" aria-label="画像と回り込みの操作">
<select id="writing" aria-label="文字の方向"><option value="vertical">日本語 · 縦書き</option><option value="horizontal">日本語 · 横書き</option></select>
<span class="sep"></span><button id="image" class="icon" title="画像を選択" aria-label="画像を選択" aria-pressed="true">▧</button><button id="shape" class="icon" title="図形を選択" aria-label="図形を選択" aria-pressed="false">▢</button>
<span class="sep"></span><button id="square" title="四角い領域を避けて回り込む" aria-pressed="true">▤ 四角</button><button id="band" title="画像のある行・列を空ける" aria-pressed="false">左右のみ</button>
<label title="画像と本文の間隔">間隔 <select id="gap" aria-label="本文との間隔"><option value="5">0.25字</option><option value="10" selected>0.5字</option><option value="20">1字</option></select></label>
<span class="sep"></span><select id="position" aria-label="ページ内の配置"><option value="right">右上</option><option value="left">左上</option><option value="center">中央</option><option value="custom" disabled>自由配置</option></select><button id="anchor" title="画像の紐づけ先の段落を変更">⚓ 紐づけ先</button><select id="target" aria-label="紐づけ先の段落" hidden><option value="harbor">港の風景</option><option value="letter">届いた手紙</option></select>
<button id="guides" class="icon" title="選択枠・段落との接続線を表示" aria-label="選択枠・段落との接続線を表示" aria-pressed="true">⌖</button><button id="reset" class="icon" title="試作を初期状態に戻す" aria-label="試作を初期状態に戻す">↶</button>
</div>
<div class="demo"><b>ページ移動の試作</b><label>前の文章量 <input id="amount" type="range" min="0" max="2" value="1" step="1" aria-label="前の文章量"></label><span id="amount-label">標準</span><span class="muted">画像は段落と同じページへ移動し、ページ内の配置を維持します。</span></div>
<div class="workspace"><div class="strip" id="strip"></div></div>
<div class="status" id="status" role="status"></div>
<script>
const $=id=>document.getElementById(id);const state={page:1,kind:'image',wrap:'square',x:176,y:48,w:124,h:155,gap:10,vertical:true,target:'harbor',selected:true};
const art='<svg viewBox="0 0 160 200" preserveAspectRatio="xMidYMid slice" aria-label="港と灯台のイラスト" role="img"><rect width="160" height="200" fill="#a6ccd2"/><circle cx="34" cy="36" r="17" fill="#f7e1ae"/><path d="M0 102 Q42 76 80 104 T160 90 V200 H0" fill="#548992"/><path d="M0 142 Q55 125 95 143 T160 127" fill="none" stroke="#b9dfdb" stroke-width="3"/><path d="M85 200 L108 126 L160 135 V200" fill="#506f69"/><path d="M113 130 L118 53 H137 L143 130" fill="#f8e8c8"/><path d="M115 53 L127 37 L140 53Z" fill="#bc695b"/><path d="M117 75 H139 M115 97 H141" stroke="#bc695b" stroke-width="10"/><path d="M123 56 H133 V66 H123Z" fill="#365267"/></svg>';
const text='海からの風が、開いた窓を通り抜けた。遠くに白い灯台が見える。私は机の上の手紙をそっと開いた。紙には懐かしい街の名前が書かれていた。あの日に交わした約束を、今でも覚えている。小さな船が港へ戻ってくる。日差しは穏やかで、波の音だけが部屋に届いていた。';
function render(){const active=Math.min(3,state.page+(state.target==='letter'?1:0));$('strip').innerHTML='';$('strip').style.flexDirection=state.vertical?'row-reverse':'row';
for(let p=0;p<4;p++){const slot=document.createElement('section');slot.className='slot';slot.innerHTML='<div class="page '+(p===active?'active':'')+'" data-page="'+p+'"></div><div class="caption">'+(p+1)+' · 本文</div><div class="group">Flow 1 · '+(p+1)+'/4</div>';const page=slot.firstChild;let n=p*39;
for(let c=0;c<(state.vertical?13:19);c++)for(let r=0;r<(state.vertical?25:13);r++){let x=state.vertical?286-c*21:25+r*21,y=state.vertical?25+r*21:26+c*27;let hit=p===active&&x+16>state.x-state.gap&&x<state.x+state.w+state.gap&&y+20>state.y-state.gap&&y<state.y+state.h+state.gap;
if(p===active&&state.wrap==='band')hit=state.vertical?(x+16>state.x-state.gap&&x<state.x+state.w+state.gap):(y+20>state.y-state.gap&&y<state.y+state.h+state.gap);
if(hit)continue;const cell=document.createElement('span');cell.className='cell'+(p===active&&n<p*39+40?' anchor':'');cell.style.left=x+'px';cell.style.top=y+'px';cell.textContent=text[n++%text.length];page.append(cell);}
if(p===active){page.insertAdjacentHTML('beforeend','<span class="anchor-tag" title="画像が紐づく段落">⚓ '+(state.target==='harbor'?'港の風景':'届いた手紙')+'</span><svg class="connector"><path d="M90 18 L'+(state.x+state.w/2)+' '+state.y+'" fill="none" stroke="#4d8cc9" stroke-dasharray="4 4"/></svg><div class="halo" style="left:'+(state.x-state.gap)+'px;top:'+(state.y-state.gap)+'px;width:'+(state.w+2*state.gap)+'px;height:'+(state.h+2*state.gap)+'px"></div><div tabindex="0" role="button" aria-label="配置画像。矢印キーで移動" title="ドラッグまたは矢印キーで移動。右下ハンドルで拡縮" class="art '+(state.kind==='shape'?'shape':'')+'" style="left:'+state.x+'px;top:'+state.y+'px;width:'+state.w+'px;height:'+state.h+'px">'+art+'<i class="handle nw"></i><i class="handle ne"></i><i class="handle sw"></i><i class="handle se" title="サイズ変更"></i></div>');}
$('strip').append(slot);}
$('strip').classList.toggle('unselected',!state.selected);$('band').textContent=state.vertical?'左右のみ':'上下のみ';$('status').textContent='⚓ '+(state.target==='harbor'?'港の風景':'届いた手紙')+' → '+(active+1)+'ページ ／ 配置 '+Math.round(state.x-24)+', '+Math.round(state.y-24)+' ／ '+Math.round(state.w)+' × '+Math.round(state.h)+'　·　サンプルの回り込み表示です。実原稿の組版・保存には接続していません。';bindArt();}
function bindArt(){const el=document.querySelector('.art');el.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();state.selected=true;const resize=e.target.classList.contains('se'),sx=e.clientX,sy=e.clientY,old={...state};el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(resize){state.w=Math.max(64,Math.min(300-old.x,old.w+dx));state.h=Math.max(64,Math.min(552-old.y,old.h+dy));}else{state.x=Math.max(24,Math.min(300-state.w,old.x+dx));state.y=Math.max(24,Math.min(552-state.h,old.y+dy));}el.style.left=state.x+'px';el.style.top=state.y+'px';el.style.width=state.w+'px';el.style.height=state.h+'px';};el.onpointerup=()=>{$('position').value='custom';render();};el.onpointercancel=()=>{Object.assign(state,old);render();};};el.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();state.x=Math.max(24,Math.min(300-state.w,state.x+(e.key==='ArrowRight'?2:e.key==='ArrowLeft'?-2:0)));state.y=Math.max(24,Math.min(552-state.h,state.y+(e.key==='ArrowDown'?2:e.key==='ArrowUp'?-2:0)));$('position').value='custom';render();document.querySelector('.art').focus();};}
$('amount').oninput=e=>{state.page=+e.target.value;$('amount-label').textContent=['少ない','標準','多い'][state.page];render();};$('writing').onchange=e=>{state.vertical=e.target.value==='vertical';render();};$('gap').onchange=e=>{state.gap=+e.target.value;render();};
for(const k of ['image','shape'])$(k).onclick=()=>{state.kind=k;for(const a of ['image','shape'])$(a).setAttribute('aria-pressed',a===k);render();};for(const k of ['square','band'])$(k).onclick=()=>{state.wrap=k;for(const a of ['square','band'])$(a).setAttribute('aria-pressed',a===k);render();};
$('position').onchange=e=>{state.x=e.target.value==='right'?300-state.w:e.target.value==='left'?24:(324-state.w)/2;state.y=e.target.value==='center'?(576-state.h)/2:48;render();};$('anchor').onclick=()=>{$('target').hidden=!$('target').hidden;if(!$('target').hidden)$('target').focus();};$('target').onchange=e=>{state.target=e.target.value;render();};$('guides').onclick=()=>{state.selected=!state.selected;$('guides').setAttribute('aria-pressed',state.selected);render();};$('reset').onclick=()=>location.reload();render();
</script></html>
