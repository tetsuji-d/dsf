<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共有編集の準備</title>
<style>body{font:16px system-ui;color:#20304c;background:#f3f6fb;margin:0;padding:28px}main{max-width:640px;margin:4vh auto;background:white;border:1px solid #d4deec;border-radius:18px;padding:32px}h1{font-size:26px}p,li{line-height:1.8}button,a{font:inherit;border-radius:8px;padding:12px 18px}button{background:#1765ed;color:white;border:0;cursor:pointer}button:disabled{opacity:.45;cursor:default}a{display:inline-block}small{color:#60708b}#status{white-space:pre-wrap;background:#f3f6fb;padding:16px;border-radius:8px}[hidden]{display:none}</style>
<main><small>ローカル検証用・実アカウントの作品は変更しません</small><h1>作品の共有編集を準備</h1><p>保存済みの原稿と所属を確認し、出版スペースのメンバーと交代で編集できる状態にします。</p><ul><li>原稿の保存先と公開済みの作品は維持されます。</li><li>所有者も「編集を開始」から編集権を取得します。</li><li>この段階では共有原稿の発行・書き出しは利用できません。</li><li>画像を含む原稿の共有登録は、画像移行対応後に提供します。</li></ul><button id="prepare">原稿を確認</button><p id="status" role="status">確認すると、作品名と登録可能な状態かを表示します。</p><button id="register" hidden>この作品を共有編集に切り替える</button><a id="open" hidden>共有エディターを開く</a></main>
<script type="module">
const base='/api/spaces/space_demo/works/work_library/sharing',status=document.querySelector('#status'),confirm=document.querySelector('#register'),open=document.querySelector('#open');let prepared;
async function call(method='GET',body){const response=await fetch(base,{method,headers:{Authorization:'Bearer fixture-owner_1','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw Error(data.error);return data;}
function registered(data){status.textContent='共有編集の準備ができました。最初は閲覧専用で開きます。';confirm.hidden=true;open.href=data.editorUrl+'&actor=owner';open.hidden=false;}
document.querySelector('#prepare').onclick=async()=>{confirm.hidden=true;open.hidden=true;try{prepared=await call();if(prepared.registered)return registered(prepared);status.textContent=prepared.spaceName+' ／ '+prepared.title+'\n'+(prepared.ready?'共有編集に登録できます。':'画像の移行が必要なため、今回は登録できません。');confirm.hidden=!prepared.ready;}catch(e){status.textContent='確認できませんでした：'+e.message;}};
confirm.onclick=async()=>{confirm.disabled=true;try{registered(await call('POST',{kind:'register',confirmationToken:prepared.confirmationToken}));}catch(e){status.textContent='登録できませんでした。原稿をもう一度確認してください：'+e.message;confirm.hidden=true;}finally{confirm.disabled=false;}};
</script></html>
