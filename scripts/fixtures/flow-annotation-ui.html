<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSF — ルビ・圏点 UI試作</title>
<link rel="stylesheet" href="/css/flow-annotations.css"><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#233249;font:14px system-ui,sans-serif}header.top{background:#132138;color:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between}h1{font-size:18px;margin:0}.tag{font-size:12px;color:#bdd0ee}.toolbar{display:flex;align-items:center;gap:10px;padding:18px 32px;background:#fff;border-bottom:1px solid #d6dfe9}button,select{font:inherit;border:1px solid #c6d2e1;border-radius:7px;padding:9px 14px;background:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:default}.workspace{display:grid;grid-template-columns:1fr 1fr 240px;gap:24px;max-width:1400px;margin:auto;padding:28px}.column h2{font-size:14px;color:#566b82;margin:0 0 12px}.surface{height:570px;background:#faf6e9;border:1px solid #e0d9c9;border-radius:3px;padding:38px;overflow:auto;box-shadow:0 5px 15px #2537570a;font-family:serif;font-size:23px;line-height:2.8;white-space:pre-wrap;overflow-wrap:anywhere}.surface[data-writing=vertical-rl]{writing-mode:vertical-rl;font-size:23px;line-height:2.8}.surface::selection,.surface *::selection{background:#a9c9ff}aside{padding:22px;background:#fff;border:1px solid #dce3ec;border-radius:10px;align-self:start}aside h2{margin:0 0 18px;font-size:17px}aside button{width:100%;margin-top:12px}.hint{font-size:13px;color:#64768b;line-height:1.8}.selected{padding:12px;background:#eef4ff;min-height:46px;border-radius:6px;font-family:serif}.notice{padding:0 32px 20px;color:#65778a;font-size:13px}.context{position:fixed;z-index:20;background:#fff;border:1px solid #c6d2e1;border-radius:9px;padding:6px;box-shadow:0 6px 24px #18345b33}.context button{display:block;border:0;width:100%;text-align:left}.context[hidden]{display:none}[role=status]{min-height:36px;padding:0 32px;color:#245fcb}@media(max-width:950px){.workspace{grid-template-columns:1fr 1fr}.workspace aside{grid-column:1/-1}.surface{padding:24px;height:450px;font-size:20px}}
</style></head><body><header class="top"><h1>DSF Studio <span class="tag">/ ルビ・圏点</span></h1><span class="tag">ローカル UI試作</span></header>
<div class="toolbar"><label>表示方向 <select id="writing"><option value="horizontal-tb">横書き</option><option value="vertical-rl">縦書き</option></select></label><button id="sample">「図書館」を選択</button><button id="undo" disabled>元に戻す</button><button id="reset">試作をリセット</button></div>
<main class="workspace"><section class="column"><h2>原稿の表示</h2><div class="surface" id="source" tabindex="0" aria-label="原稿プレビュー"></div></section><section class="column"><h2>キャンバスの表示</h2><div class="surface" id="canvas" tabindex="0" aria-label="キャンバスプレビュー"></div></section><aside><h2>編集プロパティ</h2><p class="hint">文字を選択して設定します。設定済みの親文字をクリックすると読みや圏点を変更できます。</p><div class="selected" id="selected">文字を選択してください</div><button id="edit" disabled>ルビ・圏点…</button><p class="hint">選択後の右クリックからも開けます。</p><p class="hint">重ね付けすると、親文字の近くにルビ、その外側に圏点を置きます。</p></aside></main>
<div role="status" id="status" aria-live="polite"></div><p class="notice">試作内のデータだけを変更します。実際の作品・保存・発行には接続していません。本文入力とページ分割はこの試作の対象外です。</p>
<div id="context" class="context" role="menu" hidden><button role="menuitem">ルビ・圏点…</button></div><script type="module" src="/scripts/fixtures/flow-annotation-ui.js"></script></body></html>
