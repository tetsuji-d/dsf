<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>最近の作業の操作検証</title><link rel="stylesheet" href="/css/recent-works.css"><style>body{font:16px system-ui;color:#172a42;background:#f6f8fc;margin:24px}button,a{padding:8px;border:1px solid #cbd3df;border-radius:6px;background:white;color:inherit;cursor:pointer}#fixture{max-width:1150px}h1{font-size:20px}</style><h1>スペース横断の最近の作業 — 隔離データ</h1><button id="lang">English</button><button id="offline">オフライン表示に切り替え</button><section id="fixture"></section><p id="action" role="status"></p><script type="module">
import {createRecentWorksUI} from '/js/recent-works-ui.js';
import {createRecentActivityClient} from '/js/recent-activity-client.js';
const user={uid:'test_owner',getIdToken:async()=> 'fixture'},activity=createRecentActivityClient({getUser:()=>user});
let en=false;const data={uid:'test_owner',online:true,catalogue:{uid:'test_owner',spaces:[{id:'s1',name:'山口出版'},{id:'s2',name:'写真のスペース'}],assignments:{p1:'s1',p2:'s2'}},owned:[{id:'p1',title:'潮騒の図書館',lastUpdated:1000},{id:'p2',title:'海辺の写真',lastUpdated:2000},{id:'p3',title:'個人のメモ',lastUpdated:3000}],locals:[{id:'local1',localOwnerUid:'test_owner',projectId:'p1',title:'潮騒の図書館（端末の編集）',updatedAt:4000},{id:'local2',title:'新しい下書き',updatedAt:5000}],shared:[{ownerUid:'member_owner',projectId:'shared_project',workId:'shared_work',title:'共同制作の本',spaceId:'joined',spaceName:'参加スペース',canEdit:true,canOpen:true,updatedAt:6000}],directory:{spaces:[{id:'joined',name:'参加スペース'}],more:true}};
const message=text=>document.getElementById('action').textContent=text;
const ui=createRecentWorksUI({root:document.getElementById('fixture'),getLocale:()=>en?'en':'ja',onCloud:async row=>{await activity.opened({projectId:row.projectId});data.history=await activity.list({force:true});ui.render(data);message('クラウドを開く: '+row.projectId);},onLocal:copy=>message('端末のコピーを開く: '+copy.id),onDelete:copy=>message('削除確認への入口: '+copy.id),onRefresh:async()=>{data.history=await activity.list({force:true});ui.render(data);},onMore:()=>{data.directory.more=false;ui.render(data);}});
document.getElementById('lang').onclick=()=>{en=!en;ui.render(data);};document.getElementById('offline').onclick=()=>ui.render({...data,online:false,owned:null,shared:[],catalogue:null,directory:null});ui.render(data);activity.list().then(history=>{data.history=history;ui.render(data);}).catch(()=>{});
</script></html>
