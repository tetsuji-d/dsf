<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安全な再開・隔離検証</title><link rel="stylesheet" href="/css/safe-resume.css"><style>body{font-family:system-ui;margin:32px;color:#172236;background:#f5f7fb}button{padding:10px;margin:5px}article{padding:16px;margin:12px 0;background:white;border:1px solid #ccd5e3;border-radius:10px}pre{white-space:pre-wrap}</style><h1>安全な再開・隔離検証</h1><p>検証専用の原稿とブラウザー内データです。実Studioの保存先には接続しません。</p><button id="compare">競合を確認する</button><button id="failure">保存失敗を試す</button><button id="unknown">画像不足を試す</button><button id="english">English</button><p id="status" role="status"></p><main id="copies"></main><script type="module">
import {createStore} from 'idb-keyval';
import {createResumeStore} from '/js/safe-resume-store.js';
import {fingerprintProject,classifyResume} from '/js/safe-resume-model.js';
import {showSafeResume} from '/js/safe-resume-ui.js';
import {detachLocalProject} from '/js/authoring-location.js';
const store=createResumeStore(createStore('dsf-safe-resume-fixture','versions')),scope={environment:'isolated-fixture',ownerUid:'fixture-owner'};
const original={version:6,projectId:'fixture-project',workId:'fixture-work',projectName:'検証用の本',title:'検証用の本',meta:{author:'検証用の作者'},languages:['ja'],defaultLang:'ja',blocks:[{id:'p1',kind:'page',content:{pageKind:'text',text:'基準となる本文',texts:{ja:'基準となる本文'}}}],visibility:'public',releaseId:'fixture-published'};
const local=structuredClone(original);local.blocks[0].content.text='端末で追加した本文';local.blocks[0].content.texts.ja='端末で追加した本文';const cloud=structuredClone(original);cloud.title='クラウドで変えたタイトル';let en=false;
const msg=document.getElementById('status'),list=document.getElementById('copies');
async function render(){list.replaceChildren();for(const r of await store.list(scope)){const card=document.createElement('article'),h=document.createElement('h2'),pre=document.createElement('pre');h.textContent=r.name;pre.textContent=JSON.stringify({title:r.project.title,projectId:r.project.projectId,workId:r.project.workId,releaseId:r.project.releaseId,visibility:r.project.visibility,text:r.project.blocks[0].content.text},null,2);card.append(h,pre);list.append(card);}}
async function open(mode){const kept=await store.retain({...scope,name:'保護した端末版',project:local});await render();showSafeResume({name:local.projectName,locale:en?'en':'ja',compare:async()=>classifyResume({base:await fingerprintProject(original),local:mode==='unknown'?null:await fingerprintProject(local),cloud:await fingerprintProject(cloud)}),onFork:async()=>{if(mode==='failure')throw Error('fixture quota');const fork=detachLocalProject(kept.project,'work_'+crypto.randomUUID());fork.localProjectId='local_'+crypto.randomUUID();fork.projectName+='（端末版から複製）';await store.retain({...scope,name:fork.projectName,project:fork});msg.textContent='別プロジェクトとして保存しました。保護した端末版とクラウド版は変更していません。';await render();},onCloud:async()=>{msg.textContent='クラウド版を選択しました。保護した端末版は保持しています。';}});}
document.getElementById('compare').onclick=()=>open('normal');document.getElementById('failure').onclick=()=>open('failure');document.getElementById('unknown').onclick=()=>open('unknown');document.getElementById('english').onclick=()=>{en=!en;msg.textContent=en?'English selected':'日本語に切り替えました';};render();
</script></html>
