<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSF 出版スペース・保存先の検証</title>
<link rel="stylesheet" href="/css/publishing-spaces.css">
<link rel="stylesheet" href="/css/publishing-space-publish-dialog.css">
<style>
body{margin:0;background:#f2f5fa;color:#26364d;font:15px system-ui,sans-serif}header{padding:16px 24px;background:#141e30;color:white;display:flex;gap:20px;align-items:center}header button{margin-left:auto}main{max-width:1140px;margin:28px auto;padding:0 20px}h1{font-size:26px}#projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:20px}.fixture-card{background:white;border:1px solid #d4dfed;border-radius:12px;padding:18px}.fixture-cover{height:160px;background:#eee9d7;border-radius:6px;display:grid;place-items:center;font-family:serif;font-size:24px}.fixture-card small{display:block;margin:12px 0}button,select{font:inherit}button{padding:8px 12px;border-radius:7px;border:1px solid #aebed3;background:white;cursor:pointer}.fixture-notice{background:#fff7d6;padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.6}.fixture-card h3{font-size:17px}.home-space-assignment{margin-bottom:0}</style>
<header><strong>DSF Studio</strong><span>ダッシュボード</span><button id="language">English / 日本語</button><button id="account">アカウント切替</button></header>
<main><p class="fixture-notice">検証専用：スペースと原稿はこのローカルサーバー内だけのサンプルです。実際の作品やクラウドには保存しません。</p>
<h1>出版スペースと原稿</h1><section id="spaces" class="publishing-space-panel"></section>
<h2>クラウド原稿</h2><p id="scope" class="home-save-scope"></p><p class="home-storage-note">クラウドに保存された原稿です。所属の変更では原稿・画像・公開URLは変わりません。</p><div id="projects"></div>
<details class="home-browser-copies"><summary>このブラウザの作業コピー</summary><p class="home-storage-note">この端末・ブラウザ内の復元用コピーです。クラウド原稿のコピーも含まれます。クラウドへの保存完了を示す一覧ではありません。</p><button id="open-file">ファイルから開く (.dsp)</button><input type="file" accept=".dsp" hidden id="file"><p>潮騒の図書館 — ブラウザ内のコピー</p></details>
</main><script type="module" src="/scripts/fixtures/publishing-spaces-ui.js"></script></html>
