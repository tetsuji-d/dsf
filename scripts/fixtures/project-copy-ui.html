<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/studio.css"><title>プロジェクト操作の検証</title><style>main{margin-left:238px;height:90vh;overflow:auto;padding:24px}#projects{width:208px}@media(max-width:600px){main{margin-left:0}}</style><main class="home-room-body"><h1>プロジェクト</h1><p>検証専用です。実際の原稿は変更しません。</p><section id="projects" ><article data-project-entry="original" class="home-project-entry" style="padding:24px;border:1px solid #aac;border-radius:12px"><h2>潮騒の図書館</h2><p id="space">山口出版</p></article></section><p id="result" role="status"></p></main><script type="module">
import {projectActionsMarkup,bindProjectActions,openProjectSpaceDialog} from '/js/project-actions-ui.js';
import {openProjectCopyDialog} from '/js/project-copy-ui.js';
import {createProjectCopyJob} from '/js/project-copy.js';
const source={version:6,projectId:'original',workId:'original_work',projectName:'潮騒の図書館',title:'潮騒の図書館',languages:['ja'],defaultLang:'ja',blocks:[{id:'page',kind:'page',content:{pageKind:'text',text:'元作品の本文。',texts:{ja:'元作品の本文。'}}}]};
const spaces=[{id:'space_yamaguchi',name:'山口出版'},{id:'space_test',name:'テスト出版'}];let spaceId='space_yamaguchi',count=0,assigns=0;
document.querySelector('article').insertAdjacentHTML('beforeend',projectActionsMarkup({...source,id:'original'}));
bindProjectActions(document.querySelector('#projects'),action=>{
const result=document.querySelector('#result');
if(action==='edit'){result.textContent='編集を開きました';return;}if(action==='delete'){result.textContent='削除の確認（検証のみ）';return;}
if(action==='move'){openProjectSpaceDialog({name:source.projectName,spaces,currentSpaceId:spaceId,onSave:async id=>{spaceId=id;document.querySelector('#space').textContent=spaces.find(s=>s.id===id)?.name||'所属未設定';}});return;}
openProjectCopyDialog({name:source.projectName,spaces,defaultSpaceId:spaceId,createJob:()=>createProjectCopyJob({readSource:async()=>source,newId:p=>p+'_'+crypto.randomUUID(),isCurrent:()=>true,
validateDestination:async id=>{if(id&&!spaces.some(s=>s.id===id))throw Error('SPACE_FORBIDDEN');},assignDestination:async()=>{if(++assigns===1)throw Error('simulated assignment failure');},
createClient:()=>{let snapshot;return {create:async p=>{snapshot??=JSON.stringify(p);if(snapshot!==JSON.stringify(p))throw Error('retry changed');if(++count===1)throw Error('simulated lost response');}};}}),onCreated:copy=>{result.textContent='保存済み：'+copy.projectName+' / '+(spaces.find(s=>s.id===copy.spaceId)?.name||'所属未設定');result.dataset.projectId=copy.projectId;result.dataset.creates=count;}});
});
</script></html>
