<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSF · Flow回り込みの実組版検証</title>
<link rel="stylesheet" href="/css/flow-annotations.css"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101827;color:#e4edf9;font:13px system-ui;height:100vh;display:flex;flex-direction:column}header{background:#080f19;padding:10px 15px;display:flex;gap:20px}header b{color:#91baff}header small{margin-left:auto;color:#e8c789}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid #354359}button,select{background:#172235;color:inherit;border:1px solid #43546e;padding:6px 10px;border-radius:5px;font:inherit;cursor:pointer}button:hover{border-color:#75adff}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #75adff}label{display:flex;align-items:center;gap:6px}.workspace{flex:1;min-height:0;display:flex}.source{width:285px;flex:none;background:#172235;padding:14px;overflow:auto}.source label{display:block;margin-bottom:16px}.source textarea{display:block;width:100%;height:185px;resize:vertical;margin-top:7px;background:#101827;color:#e4edf9;border:1px solid #43546e;border-radius:4px;padding:10px;font:13px/1.8 serif}.source p{font-size:11px;color:#a7b9d2;line-height:1.7}.viewport{flex:1;overflow:auto;background:#252c37}.strip{display:flex;gap:25px;width:max-content;min-width:100%;padding:28px}.slot{flex:none}.page{box-shadow:0 2px 12px #0006}.slot.anchored .page{outline:2px solid #75adff;outline-offset:3px}.slot.anchored [data-flow-block-id=anchor]{background:#84baff22}.caption{text-align:center;padding:9px;color:#cfe2ff}.wrap-image{outline:1px solid #719ac2}.status{padding:9px 14px;background:#111b2a;border-top:1px solid #354359;min-height:38px;color:#bbd8ff}.status[data-error=true]{color:#ffc7b3}.note{font-size:11px;padding:5px 14px;color:#a7b9d2}a{color:#a6cdff}@media(max-width:800px){.source{width:230px}}
</style>
<header><b>DSF Studio</b><span>Flow · 回り込みの実組版検証</span><small>ローカル検証専用 · 保存しません</small></header>
<div class="tools"><select id="writing" aria-label="文字方向"><option value="vertical-rl">日本語 · 縦書き</option><option value="horizontal-tb">日本語 · 横書き</option></select><select id="wrap" aria-label="回り込み"><option value="square">四角 · 広い側に回り込み</option><option value="band">画像のある行・列を空ける</option></select><select id="position" aria-label="画像配置"><option value="right">右上</option><option value="left">左上</option><option value="center">中央</option></select><label>間隔<select id="gap" aria-label="本文との間隔"><option value="8">0.5字</option><option value="16">1字</option><option value="24">1.5字</option></select></label><button id="more" title="前の段落へ文章を追加">前の文章を増やす</button><button id="less" title="直前の追加を取り消す">追加を戻す</button><button id="annotations" aria-pressed="false" title="サンプルの灯台にルビ、約束に圏点を付ける">ルビ・圏点の例</button><button id="reset" title="サンプルを初期化">↶ 初期化</button></div>
<div class="workspace"><aside class="source"><label>前の段落<textarea id="before" aria-label="前の段落"></textarea></label><label>⚓ 画像が紐づく段落<textarea id="anchor" aria-label="画像が紐づく段落"></textarea></label><p>本文を編集すると実測して再ページ化します。画像はこの段落の先頭があるページに一度だけ配置します。</p><p>画像の位置・サイズはページ移動後も同じです。中央配置では広い側だけに回り込みます。</p><p>段落・改行・手動改ページとルビ・圏点を検証します。注釈のある原稿では、領域ごとに1字分の安全余白を確保します。扉の配置は未対応として停止します。</p></aside><main class="viewport"><div class="strip" id="pages"></div></main></div>
<div class="status" id="status" role="status">組版を準備しています…</div><div class="note">既存のFlow段落・文字範囲・DOM計測を使用。発行用の認定フォント検証、直接編集、DSP保存・発行は未接続。</div>
<script type="module" src="/js/fixtures/flow-image-wrap-lab.js"></script></html>
