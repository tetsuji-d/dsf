<style>body{font:15px system-ui;background:#f6f8fc;color:#243043;margin:0}button{cursor:pointer}#home-room{display:block;padding:24px}.home-room-header{padding:0!important}.home-room-body{display:flex;flex-direction:column;gap:24px;padding:0!important}.home-dashboard-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.home-stat-card{display:grid;padding:16px;gap:12px;background:white;border:1px solid #d4dbe5;border-radius:12px}.home-stat-card strong,.home-stat-card small,.home-stat-card span{display:block}.home-stat-card strong{font-size:24px}.home-stat-card small{font-size:12px}.home-stat-link{font-size:12px}.material-icons{font-size:0}.studio-current-work-cover .material-icons:after{content:'DSF';font:bold 16px system-ui}nav{display:flex;gap:8px;margin-bottom:16px}nav button,#fixture-language{padding:12px}dialog{max-width:640px;max-height:80vh;overflow:auto;border:1px solid #ccd4df;border-radius:12px;padding:24px}dialog::backdrop{background:#0006}.studio-file-types img{width:48px;height:48px}.studio-install-guide summary{padding:12px;cursor:pointer}.studio-version [hidden],[hidden]{display:none!important}</style>
